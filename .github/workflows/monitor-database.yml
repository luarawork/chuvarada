name: Monitor Database Size

# Verifica o tamanho do banco Supabase diariamente e falha o job (pra gerar
# notificação do GitHub) se passar de 480MB -- 96% do limite gratuito de
# 500MB (ver scripts/maintenance.sql e o incidente de 25/07/2026 em que o
# banco chegou a 135% do limite sem ninguém perceber a tempo). Usa a RPC
# get_db_size (migração 035_db_size_function.sql) via chave anon --
# pública por design, não é um secret sensível igual CRON_SECRET.
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check database size
        run: |
          RESPONSE=$(curl -s \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/get_db_size")

          SIZE=$(echo "$RESPONSE" | jq -r '.size_mb')

          if [ -z "$SIZE" ] || [ "$SIZE" = "null" ]; then
            echo "❌ Falha ao ler o tamanho do banco -- resposta: $RESPONSE"
            exit 1
          fi

          echo "Database size: ${SIZE}MB"
          echo "$RESPONSE" | jq -r '.tables[] | "  \(.table): \(.size_mb)MB"'

          if (( $(echo "$SIZE > 480" | bc -l) )); then
            echo "⚠️ ALERTA: Banco acima de 480MB (${SIZE}MB)"
            exit 1
          else
            echo "✅ Banco saudável: ${SIZE}MB / 500MB"
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
